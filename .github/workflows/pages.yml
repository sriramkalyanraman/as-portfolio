name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Apply site branding
        run: |
          python3 scripts/apply-branding.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          location_re = re.compile(r'\s*<section class="section soft" id="locations".*?</section>\s*', re.DOTALL)
          footer_re = re.compile(r'\s*<footer>.*?</footer>\s*', re.DOTALL)

          location = location_re.search(text)
          location_html = location.group(0).strip() if location else ''
          text = location_re.sub('\n', text)
          text = footer_re.sub('\n', text)

          if location_html:
              contact_re = re.compile(r'(?=<section\s+id="contact"\s+class="section\s+contact"[^>]*>)')
              if contact_re.search(text):
                  text = contact_re.sub(location_html + '\n', text, count=1)
              else:
                  text = text.replace('</main>', location_html + '\n</main>', 1)

          text = text.replace('</body>', '<footer><span>© 2026 Aishwarya Sreenivasan</span></footer>\n</body>', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
