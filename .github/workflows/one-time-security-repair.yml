          Path('SECURITY_BASELINE.md').write_text('''# Security Baseline

This is a static GitHub Pages site. The application attack surface is intentionally small: there is no server-side application, database, authentication system, file upload, or API endpoint owned by the site.

## Repository and supply-chain controls

- GitHub Actions use least-privilege workflow permissions.
- Pages deployment uses a dedicated `github-pages` environment.
- Deployment concurrency prevents overlapping Pages deployments.
- Third-party GitHub Actions are pinned to full immutable commit SHAs.
- Dependabot monitors GitHub Actions dependencies weekly.
- CODEOWNERS identifies security-sensitive repository configuration for review.
- `.gitignore` excludes common secrets, logs, temporary files, and build output.
- No application secrets are required by the site.

## Website controls

- GitHub Pages provides HTTPS for the custom domain.
- The site has no user authentication, sessions, database, server-side form processing, or uploads.
- External links opened in a new tab use opener isolation.
- Contact input is client-side only and is URL-encoded before the WhatsApp hand-off.
- Users are warned not to submit sensitive clinical information through the contact flow.
- Security reporting is documented in `SECURITY.md` and `.well-known/security.txt`.

## Platform controls still requiring GitHub/account administration

Repository branch protection, secret-scanning/push-protection settings, custom-domain verification, HTTPS enforcement, and protected-environment approval rules are GitHub account/repository settings rather than files in the site repository. They should remain enabled where supported.
