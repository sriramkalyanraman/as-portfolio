name: One-time homepage repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore known-good homepage
        run: git checkout 1d2b3bcbf8d4e72fd6b46f5461f988f2120a55a8 -- index.html

      - name: Remove accidental security checkpoint files
        shell: bash
        run: |
          rm -f test-security-note.txt security-review.txt security-review.md security-review-2026.md security-summary.txt _headers

      - name: Commit restored homepage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git add -u
          git commit -m 'Restore known-good homepage' || exit 0
          git push origin HEAD:main
