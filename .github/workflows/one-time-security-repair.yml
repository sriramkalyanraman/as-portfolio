name: One-time security repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Restore known-good homepage and harden repository
        shell: bash
        run: |
          set -euo pipefail

          git checkout 1d2b3bcbf8d4e72fd6b46f5461f988f2120a55a8 -- index.html

          python3 - <<'PY'
          from pathlib import Path
          import re

